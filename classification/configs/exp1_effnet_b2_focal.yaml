# Experiment 1: EfficientNet-B2 + Focal Loss
# Purpose: Baseline for 5-class classification with Focal Loss
# Expected training time: 2-3 hours on V100 GPU

experiment_name: "exp1_effnet_b2_focal"
run_name: "exp1_effnet_b2_focal"

# Model & Loss
model_name: "effnet_b2"
loss_type: "focal"

# Training hyperparameters
epochs: 100
batch_size: 256
lr: 8e-4
seed: 42
num_workers: 4
pin_memory: true

# Focal Loss parameters
focal_gamma: 2.0
focal_alpha: 0.25

# Directories (relative to the project root)
parquet_path: "../../OTHER_OIL_SPILL_DATASETS/OIL_SPILL_Segmentation/MULTICLASSIFICATION/stage2_m4d_ovr/m4d_stage2_ovr_index.parquet"
patches_dir: "../../OTHER_OIL_SPILL_DATASETS/OIL_SPILL_Segmentation/MULTICLASSIFICATION/stage2_m4d_ovr/patches_npy"
weights_dir: "results/exp1_effnet_b2_focal/"
runs_dir: "results/exp1_effnet_b2_focal/runs"

# Calibration
calibrate_after: true

# System
device: "cuda"
